global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "patients-service"
    static_configs:
      - targets: ["patients-service:3001"]

  - job_name: "doctors-service"
    static_configs:
      - targets: ["doctors-service:3002"]

  - job_name: "appointments-service"
    static_configs:
      - targets: ["appointments-service:3003"]

  - job_name: "lab-service"
    static_configs:
      - targets: ["lab-service:3004"]

  - job_name: "pharmacy-service"
    static_configs:
      - targets: ["pharmacy-service:3005"]

  - job_name: "billing-service"
    static_configs:
      - targets: ["billing-service:3006"]

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:3007"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

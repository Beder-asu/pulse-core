services:
  # ----------------------------------------
  # Core Databases
  # ----------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pulsecore-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - hospital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-setup:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: pulsecore-db-setup
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - DEMO_USER_PASSWORD=${DEMO_USER_PASSWORD:?Set DEMO_USER_PASSWORD in .env}
    networks:
      - hospital-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7.2-alpine
    container_name: pulsecore-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hospital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------
  # Frontend and API Gateway
  # ----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsecore-frontend
    expose:
      - "80"
    networks:
      - hospital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  api-gateway:
    image: nginx:alpine
    container_name: pulsecore-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cors.conf:/etc/nginx/cors.conf:ro
    networks:
      - hospital-network
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      patients-service:
        condition: service_started
      doctors-service:
        condition: service_started
      appointments-service:
        condition: service_started
      lab-service:
        condition: service_started
      pharmacy-service:
        condition: service_started
      billing-service:
        condition: service_started
      notification-service:
        condition: service_started

  # ----------------------------------------
  # Message Broker (Kafka)
  # ----------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pulsecore-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: ADUDsqPd7-TKj2h5CMXyrw
    networks:
      - hospital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ----------------------------------------
  # Microservices
  # ----------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: pulsecore-auth
    ports:
      - "3008:3008"
    environment:
      - POSTGRES_BASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/auth_db
      - SERVICE_PORT=3008
      - SERVICE_NAME=auth-service
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in .env}
      - KAFKA_BROKERS=kafka:29092
    networks:
      - hospital-network
    depends_on:
      db-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  patients-service:
    build:
      context: .
      dockerfile: services/patients/Dockerfile
    container_name: pulsecore-patients
    ports:
      - "3001:3001"
    environment:
      - POSTGRES_BASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/patients_db
      - PORT=3001
      - SERVICE_NAME=patients-service
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in .env}
    networks:
      - hospital-network
    depends_on:
      db-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  doctors-service:
    build:
      context: .
      dockerfile: services/doctors/Dockerfile
    container_name: pulsecore-doctors
    ports:
      - "3002:3002"
    environment:
      - POSTGRES_BASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/doctors_db
      - PORT=3002
      - SERVICE_NAME=doctors-service
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in .env}
      - REDIS_URL=redis://redis:6379
      - REDIS_CONNECT_TIMEOUT_MS=1000
      - REDIS_RETRY_COOLDOWN_MS=5000
      - DOCTOR_LIST_CACHE_TTL_SECONDS=300
      - DOCTOR_PROFILE_CACHE_TTL_SECONDS=300
    networks:
      - hospital-network
    depends_on:
      db-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  appointments-service:
    build:
      context: .
      dockerfile: services/appointments/Dockerfile
    container_name: pulsecore-appointments
    ports:
      - "3003:3003"
    environment:
      - POSTGRES_BASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/appointments_db
      - PORT=3003
      - SERVICE_NAME=appointments-service
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in .env}
      - DOCTORS_SERVICE_URL=http://doctors-service:3002
      - PATIENTS_SERVICE_URL=http://patients-service:3001
      - KAFKA_BROKERS=kafka:29092
    networks:
      - hospital-network
    depends_on:
      db-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  lab-service:
    build:
      context: .
      dockerfile: services/lab/Dockerfile
    container_name: pulsecore-lab
    ports:
      - "3004:3004"
    environment:
      - POSTGRES_BASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/lab_db
      - PORT=3004
      - SERVICE_NAME=lab-service
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in .env}
    networks:
      - hospital-network
    depends_on:
      db-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  pharmacy-service:
    build:
      context: .
      dockerfile: services/pharmacy/Dockerfile
    container_name: pulsecore-pharmacy
    ports:
      - "3005:3005"
    environment:
      - POSTGRES_BASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pharmacy_db
      - PORT=3005
      - SERVICE_NAME=pharmacy-service
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in .env}
    networks:
      - hospital-network
    depends_on:
      db-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  billing-service:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    container_name: pulsecore-billing
    ports:
      - "3006:3006"
    environment:
      - POSTGRES_BASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/billing_db
      - PORT=3006
      - SERVICE_NAME=billing-service
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in .env}
    networks:
      - hospital-network
    depends_on:
      db-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: pulsecore-notification
    ports:
      - "3007:3007"
    environment:
      - POSTGRES_BASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/notification_db
      - PORT=3007
      - SERVICE_NAME=notification-service
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?Set INTERNAL_SERVICE_SECRET in .env}
      - DOCTORS_SERVICE_URL=http://doctors-service:3002
      - PATIENTS_SERVICE_URL=http://patients-service:3001
      - KAFKA_BROKERS=kafka:29092
    networks:
      - hospital-network
    depends_on:
      db-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

# ----------------------------------------
# Observability Stack
# ----------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: pulsecore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - hospital-network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: pulsecore-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - hospital-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pulsecore-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC default port
      - "4318:4318"   # OTLP HTTP default port
    networks:
      - hospital-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: pulsecore-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - hospital-network
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

# ----------------------------------------
# Persistent Storage Volumes
# ----------------------------------------
volumes:
  postgres_data:
  redis_data:

    # ----------------------------------------
    # Custom Network
    # ----------------------------------------
networks:
  hospital-network:
    driver: bridge

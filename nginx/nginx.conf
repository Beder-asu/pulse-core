events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Global CORS Settings
    map $http_origin $cors_origin {
        default "";
        "~^http://localhost(:[0-9]+)?$" "$http_origin";
    }

    server {
        listen 80;
        server_name localhost;

        # Common proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        resolver 127.0.0.11 valid=30s;

        # Microservice Routing Rules

        # 1. Auth Service
        location /api/auth {
            include cors.conf;
            set $auth_backend http://auth-service:3008;
            proxy_pass $auth_backend;
        }

        # 2. Patients Service
        location /api/patients {
            include cors.conf;
            set $patients_backend http://patients-service:3001;
            proxy_pass $patients_backend;
        }

        # 3. Doctors Service
        location /api/doctors {
            include cors.conf;
            set $doctors_backend http://doctors-service:3002;
            proxy_pass $doctors_backend;
        }

        # 4. Appointments Service
        location /api/appointments {
            include cors.conf;
            set $appointments_backend http://appointments-service:3003;
            proxy_pass $appointments_backend;
        }

        # 5. Lab Service
        location /api/lab {
            include cors.conf;
            set $lab_backend http://lab-service:3004;
            proxy_pass $lab_backend;
        }

        # 6. Pharmacy Service
        location /api/pharmacy {
            include cors.conf;
            set $pharmacy_backend http://pharmacy-service:3005;
            proxy_pass $pharmacy_backend;
        }

        # 7. Billing Service
        location /api/billing {
            include cors.conf;
            set $billing_backend http://billing-service:3006;
            proxy_pass $billing_backend;
        }

        # 8. Notification Service
        location /api/notifications {
            include cors.conf;
            set $notification_backend http://notification-service:3007;
            proxy_pass $notification_backend;
        }

        # Frontend SPA
        location / {
            set $frontend_backend http://frontend:80;
            proxy_pass $frontend_backend;
        }
    }
}

events {
    worker_connections 1024;
}

http {
    upstream patients       { server patients-service:3001; }
    upstream doctors        { server doctors-service:3002; }
    upstream appointments   { server appointments-service:3003; }
    upstream lab            { server lab-service:3004; }
    upstream pharmacy       { server pharmacy-service:3005; }
    upstream billing        { server billing-service:3006; }
    upstream notifications  { server notification-service:3007; }

    server {
        listen 80;

        # --- CORS (centralized) ---
        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Idempotency-Key" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # --- SSE endpoints (disable proxy buffering) ---
        location /api/lab/results/stream {
            proxy_pass http://lab;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        location /api/notifications/stream {
            proxy_pass http://notifications;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        # --- Service routing ---
        location /api/patients/ {
            proxy_pass http://patients;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/doctors/ {
            proxy_pass http://doctors;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/appointments/ {
            proxy_pass http://appointments;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/lab/ {
            proxy_pass http://lab;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/pharmacy/ {
            proxy_pass http://pharmacy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/billing/ {
            proxy_pass http://billing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/notifications/ {
            proxy_pass http://notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
